<svg xmlns="http://www.w3.org/2000/svg" width="550" height="120" viewBox="0 0 550 120" role="img" aria-labelledby="title">
<title id="title">Illustration of the muted, active and unknown indicator states</title>
<rect width="550" height="120" rx="12" fill="#17202a"/>
<g font-family="sans-serif" font-size="18" font-weight="600">
<rect x="18" y="28" width="158" height="64" rx="20" fill="#303640" stroke="#fff" stroke-opacity=".6"/><text x="38" y="67" fill="#ef4444">●  Muted</text>
<rect x="196" y="28" width="158" height="64" rx="20" fill="#303640" stroke="#fff" stroke-opacity=".6"/><text x="216" y="67" fill="#22c55e">●  Live</text>
<rect x="374" y="28" width="158" height="64" rx="20" fill="#303640" stroke="#fff" stroke-opacity=".6"/><text x="394" y="67" fill="#9ca3af">●  Unknown</text>
</g></svg>
